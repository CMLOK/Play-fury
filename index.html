<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FURY — 7-Question Daily Blitz</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131a2a;
      --surface-2: #1a243a;
      --border: #2a3858;
      --text: #eef2ff;
      --muted: #94a3b8;
      --accent: #f97316;
      --accent-2: #fb923c;
      --good: #22c55e;
      --warn: #eab308;
      --rare: #a855f7;
      --common: #38bdf8;
      --bad: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #162038 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 48px;
    }

    .app {
      width: 100%;
      max-width: 720px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: 0.08em;
      font-weight: 900;
      color: var(--accent-2);
    }

    .tag {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .hud-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .progress-bar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 18px;
    }

    .seg {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: background 0.2s ease;
    }

    .seg.done {
      background: var(--good);
      border-color: var(--good);
    }

    .seg.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .prompt-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .prompt-title {
      margin: 0 0 18px;
      font-size: 1.5rem;
      line-height: 1.3;
    }

    .phase-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .phase-label {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--accent-2);
    }

    .timer.urgent {
      color: var(--bad);
    }

    .read-box {
      padding: 18px;
      border-radius: 12px;
      background: rgba(249, 115, 22, 0.08);
      border: 1px dashed var(--accent);
      color: var(--text);
      text-align: center;
      margin-bottom: 14px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1.05rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="text"]:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: var(--accent);
      color: #0b0f19;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-2);
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }

    button.secondary:hover:not(:disabled) {
      background: #243250;
    }

    .feedback {
      min-height: 28px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ok { color: var(--good); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }

    .hits-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .hit-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .tier-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .tier-mythic { background: rgba(234, 179, 8, 0.2); color: #fde047; }
    .tier-rare { background: rgba(168, 85, 247, 0.22); color: #d8b4fe; }
    .tier-uncommon { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
    .tier-common { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 16px 0 20px;
    }

    .stat-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .q-summary-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .q-summary-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .answer-bank-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .bank-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .bank-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .bank-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .bank-chip.matched {
      border-color: var(--good);
      color: var(--text);
      background: rgba(34, 197, 94, 0.12);
    }

    textarea {
      width: 100%;
      min-height: 155px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.45;
      margin-top: 10px;
      resize: vertical;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .shake {
      animation: shake 0.25s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .link-btn {
      background: none;
      border: none;
      padding: 0;
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .link-btn:hover {
      color: var(--text);
    }
  </style>
</head>

    function decodeHtmlEntities(str) {
      const txt = document.createElement("textarea");
      txt.innerHTML = String(str || "");
      return txt.value.replace(/\u00ad/g, "");
    }

    function normalizeText(str) {
      return decodeHtmlEntities(String(str || ""))
        .toLowerCase()
        .replace(/[\u00e1\u00e0\u00e2\u00e4\u00e3\u00e5\u0101]/g, "a")
        .replace(/[\u00e9\u00e8\u00ea\u00eb\u0113]/g, "e")
        .replace(/[\u00ed\u00ec\u00ee\u00ef\u012b]/g, "i")
        .replace(/[\u00f3\u00f2\u00f4\u00f6\u00f5\u00f8\u014d]/g, "o")
        .replace(/[\u00fa\u00f9\u00fb\u00fc\u016b]/g, "u")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function questionSignature(qText) {
      return normalizeText(qText);
    }

    function getDayOffset() {
      return Number(localStorage.getItem(STORAGE_KEYS.dayOffset) || "0");
    }

    function setDayOffset(val) {
      localStorage.setItem(STORAGE_KEYS.dayOffset, String(val));
    }

    function getEffectiveDateKey() {
      const now = new Date();
      const offset = getDayOffset();
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatDisplayDate(dateKey) {
      const [y, m, d] = dateKey.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      });
    }

    function getJsonStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function setJsonStorage(key, val) {
      localStorage.setItem(key, JSON.stringify(val));
    }

    function getUsedPromptIds() {
      return getJsonStorage(STORAGE_KEYS.usedPromptIds, []);
    }

    function saveUsedPromptIds(arr) {
      setJsonStorage(STORAGE_KEYS.usedPromptIds, [...new Set(arr)]);
    }

    function getUsedQuestionSigs() {
      return getJsonStorage(STORAGE_KEYS.usedQuestionSigs, []);
    }

    function saveUsedQuestionSigs(arr) {
      setJsonStorage(STORAGE_KEYS.usedQuestionSigs, [...new Set(arr)]);
    }

    function getRunsMap() {
      return getJsonStorage(STORAGE_KEYS.runsByDate, {});
    }

    function saveRunsMap(map) {
      setJsonStorage(STORAGE_KEYS.runsByDate, map);
    }

    function bumpFreq(dateKey, promptId, canonicalKey) {
      try {
        const all = getJsonStorage(STORAGE_KEYS.freqByDate, {});
        if (!all[dateKey]) all[dateKey] = {};
        if (!all[dateKey][promptId]) all[dateKey][promptId] = {};
        all[dateKey][promptId][canonicalKey] = (all[dateKey][promptId][canonicalKey] || 0) + 1;
        setJsonStorage(STORAGE_KEYS.freqByDate, all);
        return all[dateKey][promptId][canonicalKey];
      } catch {
        return 1;
      }
    }

    function seededShuffle(list, seedStr) {
      let h = 2166136261;
      for (let i = 0; i < seedStr.length; i++) {
        h ^= seedStr.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        h ^= h << 13;
        h ^= h >>> 17;
        h ^= h << 5;
        const j = Math.abs(h) % (i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function rarityTierFromPoints(pts) {
      if (pts >= 45) return { label: "Mythic", emoji: "🟨", cls: "tier-mythic" };
      if (pts >= 35) return { label: "Rare", emoji: "🟪", cls: "tier-rare" };
      if (pts >= 25) return { label: "Uncommon", emoji: "🟦", cls: "tier-uncommon" };
      return { label: "Common", emoji: "⬜", cls: "tier-common" };
    }

    function pointsForTriviaDifficulty(diff) {
      if (diff === "hard") return 45;
      if (diff === "medium") return 30;
      return 20;
    }

    async function getOrCreateOpenTdbToken() {
      let token = localStorage.getItem(STORAGE_KEYS.openTdbToken) || "";
      if (token) return token;
      const resp = await fetch("https://opentdb.com/api_token.php?command=request");
      const data = await resp.json();
      if (data && data.token) {
        token = data.token;
        localStorage.setItem(STORAGE_KEYS.openTdbToken, token);
        return token;
      }
      return "";
    }

    async function resetOpenTdbToken(token) {
      if (!token) return;
      await fetch(`https://opentdb.com/api_token.php?command=reset&token=${encodeURIComponent(token)}`);
    }

        function isBritishOrUkQuestion(text, category) {
      const hay = normalizeText(`${text || ""} ${category || ""}`);
      if (!hay) return false;
      const blockedTerms = [
        "british",
        "britain",
        "united kingdom",
        "england",
        "english",
        "scotland",
        "scottish",
        "wales",
        "welsh",
        "london",
        "uk",
        "briton",
        "britons",
        "cymru",
        "hogmanay",
        "thames",
        "westminster",
        "parliament of the united kingdom",
        "royal family"
      ];
      const words = new Set(hay.split(" "));
      for (const term of blockedTerms) {
        if (term.includes(" ")) {
          if (hay.includes(term)) return true;
        } else if (words.has(term)) {
          return true;
        }
      }
      return false;
    }

    async function fetchLiveWebQuestions(countNeeded, usedSigsSet) {
      const collected = [];
      try {
        let token = await getOrCreateOpenTdbToken();
        const tokenParam = token ? `&token=${encodeURIComponent(token)}` : "";
        let url = `https://opentdb.com/api.php?amount=15&type=multiple${tokenParam}`;
        let resp = await fetch(url);
        let data = await resp.json();

        if (data && data.response_code === 4 && token) {
          await resetOpenTdbToken(token);
          resp = await fetch(`https://opentdb.com/api.php?amount=15&type=multiple&token=${encodeURIComponent(token)}`);
          data = await resp.json();
        }

        if (data && data.response_code === 0 && Array.isArray(data.results)) {
          for (const item of data.results) {
            const qText = decodeHtmlEntities(item.question);
            const qCat = decodeHtmlEntities(item.category || "World Trivia");
            const sig = questionSignature(qText);
            if (!sig || usedSigsSet.has(sig)) continue;
            if (isBritishOrUkQuestion(qText, qCat)) continue;

            const correctRaw = decodeHtmlEntities(item.correct_answer);
            const incorrectRaw = Array.isArray(item.incorrect_answers)
              ? item.incorrect_answers.map(decodeHtmlEntities)
              : [];
            if ([correctRaw, ...incorrectRaw].some(opt => isBritishOrUkQuestion(opt, ""))) continue;

            const answers = {};
            const aliases = {};
            const diffPts = pointsForTriviaDifficulty(item.difficulty);

            const correctNorm = normalizeText(correctRaw);
            if (correctNorm) {
              answers[correctNorm] = diffPts;
              if (correctNorm.startsWith("the ")) {
                const stripped = correctNorm.replace(/^the\s+/, "");
                if (stripped) aliases[stripped] = correctNorm;
              } else {
                aliases["the " + correctNorm] = correctNorm;
              }
            }

            incorrectRaw.forEach((inc, idx) => {
              const incNorm = normalizeText(inc);
              if (incNorm && !Object.prototype.hasOwnProperty.call(answers, incNorm)) {
                answers[incNorm] = Math.max(15, diffPts - 10 - idx * 3);
              }
            });

            if (Object.keys(answers).length >= 2) {
              usedSigsSet.add(sig);
              collected.push({
                id: `web_otdb_${btoa(unescape(encodeURIComponent(sig))).slice(0, 16)}`,
                isIrelandOrGaeilge: false,
                isWebTrivia: true,
                category: decodeHtmlEntities(item.category || "World Trivia"),
                question: qText,
                answers,
                aliases
              });
            }

            if (collected.length >= countNeeded) break;
          }
        }
      } catch (err) {
        console.warn("Live trivia fetch fell back to local bank:", err);
      }
      return collected;
    }

    function pickLocalFallbackPrompts(dateKey, countNeeded, requireIreland, usedIds, usedSigsSet) {
      const pool = PROMPT_BANK.filter(p => requireIreland ? p.isIrelandOrGaeilge : (!p.isIrelandOrGaeilge && !isBritishOrUkQuestion(p.question, p.category)));
      let candidates = pool.filter(p => !usedIds.includes(p.id) && !usedSigsSet.has(questionSignature(p.question)));

      if (candidates.length < countNeeded) {
        // Reset only this sub-pool's used IDs so the game never runs out of questions
        const poolIds = new Set(pool.map(p => p.id));
        const remainingUsedIds = usedIds.filter(id => !poolIds.has(id));
        saveUsedPromptIds(remainingUsedIds);
        usedIds = remainingUsedIds;
        candidates = pool.filter(p => !usedSigsSet.has(questionSignature(p.question)));
        if (candidates.length < countNeeded) {
          candidates = [...pool];
        }
      }

      const shuffled = seededShuffle(candidates, dateKey + (requireIreland ? "-ie-fb" : "-gen-fb"));
      return shuffled.slice(0, countNeeded);
    }

    async function buildDailyPrompts(dateKey) {
      const runs = getRunsMap();
      if (runs[dateKey] && Array.isArray(runs[dateKey].prompts) && runs[dateKey].prompts.length === QUESTIONS_PER_DAY) {
        return runs[dateKey].prompts;
      }

      let usedIds = getUsedPromptIds();
      const usedSigs = getUsedQuestionSigs();
      const usedSigsSet = new Set(usedSigs);

      // Include at least 1 Ireland/Gaeilge prompt + live web questions + non-repeating local prompts
      const iePrompt = pickLocalFallbackPrompts(dateKey, 1, true, usedIds, usedSigsSet)[0];
      usedSigsSet.add(questionSignature(iePrompt.question));

      const webQuestions = await fetchLiveWebQuestions(QUESTIONS_PER_DAY - 1, usedSigsSet);
      const stillNeeded = Math.max(0, (QUESTIONS_PER_DAY - 1) - webQuestions.length);
      const localGenNeeded = Math.max(1, stillNeeded);
      const localGen = pickLocalFallbackPrompts(dateKey, localGenNeeded, false, usedIds, usedSigsSet);

      const combinedRaw = [iePrompt, ...webQuestions, ...localGen].slice(0, QUESTIONS_PER_DAY);
      const ordered = seededShuffle(combinedRaw, dateKey + "-daily-order");

      const nextUsedIds = [...usedIds, ...ordered.filter(p => !p.isWebTrivia).map(p => p.id)];
      saveUsedPromptIds(nextUsedIds);

      const nextUsedSigs = [...usedSigs, ...ordered.map(p => questionSignature(p.question)).filter(Boolean)];
      saveUsedQuestionSigs(nextUsedSigs);

      if (!runs[dateKey]) {
        runs[dateKey] = {
          dateKey,
          prompts: ordered,
          completed: false,
          results: [],
          totalScore: 0,
          bestStreak: 0
        };
        saveRunsMap(runs);
      }

      return ordered;
    }

    function resolveAnswer(prompt, rawInput) {
      const norm = normalizeText(rawInput);
      if (!norm) return null;

      if (prompt.aliases && Object.prototype.hasOwnProperty.call(prompt.aliases, norm)) {
        const target = prompt.aliases[norm];
        if (Object.prototype.hasOwnProperty.call(prompt.answers, target)) {
          return { canonical: target, basePoints: prompt.answers[target] };
        }
      }

      if (Object.prototype.hasOwnProperty.call(prompt.answers, norm)) {
        return { canonical: norm, basePoints: prompt.answers[norm] };
      }

      if (norm.length >= 6) {
        for (const [key, pts] of Object.entries(prompt.answers)) {
          if (Math.abs(key.length - norm.length) <= 1 && levenshtein1(key, norm) <= 1) {
            return { canonical: key, basePoints: pts };
          }
        }
      }

      return null;
    }

    function levenshtein1(a, b) {
      if (a === b) return 0;
      const m = a.length;
      const n = b.length;
      if (Math.abs(m - n) > 1) return 2;
      let i = 0, j = 0, edits = 0;
      while (i < m && j < n) {
        if (a[i] === b[j]) {
          i++; j++;
        } else {
          edits++;
          if (edits > 1) return 2;
          if (m > n) i++;
          else if (n > m) j++;
          else { i++; j++; }
        }
      }
      if (i < m || j < n) edits++;
      return edits;
    }

    let state = {
      dateKey: "",
      prompts: [],
      qIndex: 0,
      phase: "loading",
      countdown: READ_SECONDS,
      timerId: null,
      seenCanonical: new Set(),
      hits: [],
      streak: 0,
      bestStreak: 0,
      totalScore: 0,
      questionResults: [],
      feedback: null
    };

    function clearTimers() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    async function initForCurrentDay() {
      clearTimers();
      const dateKey = getEffectiveDateKey();
      document.getElementById("datePill").textContent = formatDisplayDate(dateKey);

      const runs = getRunsMap();
      const savedRun = runs[dateKey];

      if (savedRun && savedRun.completed) {
        state = {
          dateKey,
          prompts: savedRun.prompts || [],
          qIndex: QUESTIONS_PER_DAY,
          phase: "finished",
          countdown: 0,
          timerId: null,
          seenCanonical: new Set(),
          hits: [],
          streak: 0,
          bestStreak: savedRun.bestStreak || 0,
          totalScore: savedRun.totalScore || 0,
          questionResults: savedRun.results || [],
          feedback: null
        };
        document.getElementById("scorePill").textContent = `Score: ${state.totalScore}`;
        render();
        return;
      }

      state.dateKey = dateKey;
      state.phase = "loading";
      state.totalScore = 0;
      document.getElementById("scorePill").textContent = "Score: 0";
      render();

      const prompts = await buildDailyPrompts(dateKey);
      if (state.dateKey !== dateKey) return;

      state = {
        dateKey,
        prompts,
        qIndex: 0,
        phase: "idle",
        countdown: READ_SECONDS,
        timerId: null,
        seenCanonical: new Set(),
        hits: [],
        streak: 0,
        bestStreak: 0,
        totalScore: 0,
        questionResults: [],
        feedback: null
      };
      render();
    }

    function startQuestionReadPhase(index) {
      clearTimers();
      state.qIndex = index;
      state.phase = "reading";
      state.countdown = READ_SECONDS;
      state.seenCanonical = new Set();
      state.hits = [];
      state.streak = 0;
      state.feedback = null;
      render();

      state.timerId = setInterval(() => {
        state.countdown -= 1;
        if (state.countdown <= 0) {
          clearTimers();
          startBlitzPhase();
        } else {
          updateTimerDisplay();
        }
      }, 1000);
    }

    function startBlitzPhase() {
      clearTimers();
      state.phase = "blitz";
      state.countdown = BLITZ_SECONDS;
      state.feedback = null;
      render();

      const input = document.getElementById("answerInput");
      if (input) input.focus();

      const startTime = Date.now();
      state.timerId = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        const remaining = Math.max(0, BLITZ_SECONDS - elapsed);
        state.countdown = remaining;
        updateTimerDisplay();
        if (remaining <= 0) {
          clearTimers();
          finishCurrentQuestion();
        }
      }, 100);
    }

    function updateTimerDisplay() {
      const el = document.getElementById("timerDisplay");
      if (!el) return;
      if (state.phase === "reading") {
        el.textContent = `${Math.max(1, Math.ceil(state.countdown))}s`;
        el.classList.remove("urgent");
      } else if (state.phase === "blitz") {
        el.textContent = `${state.countdown.toFixed(1)}s`;
        el.classList.toggle("urgent", state.countdown <= 5);
      }
    }

    function handleAnswerSubmit(e) {
      e.preventDefault();
      if (state.phase !== "blitz") return;

      const input = document.getElementById("answerInput");
      const raw = input.value;
      input.value = "";
      input.focus();

      const prompt = state.prompts[state.qIndex];
      const match = resolveAnswer(prompt, raw);

      if (!match) {
        state.streak = 0;
        state.feedback = { type: "bad", text: raw.trim() ? `"${raw.trim()}" didn't count` : "Type an answer and hit Enter" };
        renderBlitzDynamic(true);
        return;
      }

      if (state.seenCanonical.has(match.canonical)) {
        state.streak = 0;
        state.feedback = { type: "warn", text: `Already entered "${match.canonical}" this round` };
        renderBlitzDynamic(true);
        return;
      }

      state.seenCanonical.add(match.canonical);
      state.streak += 1;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;

      const seenCount = bumpFreq(state.dateKey, prompt.id, match.canonical);
      const repeatPenalty = seenCount > 1 ? Math.max(0.65, 1 - (seenCount - 1) * 0.1) : 1;
      const streakBonus = state.streak >= 3 ? (state.streak - 2) * 4 : 0;
      const earned = Math.round(match.basePoints * repeatPenalty) + streakBonus;

      state.totalScore += earned;
      document.getElementById("scorePill").textContent = `Score: ${state.totalScore}`;

      const tier = rarityTierFromPoints(match.basePoints);
      state.hits.unshift({
        label: match.canonical,
        points: earned,
        tier
      });

      state.feedback = {
        type: "ok",
        text: `+${earned} pts · ${match.canonical} (${tier.label}${state.streak >= 3 ? ` · ${state.streak}x streak` : ""})`
      };

      renderBlitzDynamic(false);
    }

    function finishCurrentQuestion() {
      const prompt = state.prompts[state.qIndex];
      const qPoints = state.hits.reduce((sum, h) => sum + h.points, 0);
      const rarest = state.hits.reduce((best, h) => {
        if (!best) return h.tier;
        const order = { Common: 1, Uncommon: 2, Rare: 3, Mythic: 4 };
        return order[h.tier.label] > order[best.label] ? h.tier : best;
      }, null);

      const allAnswersWithRarity = Object.entries(prompt.answers || {})
        .map(([ans, pts]) => ({
          answer: ans,
          points: pts,
          tier: rarityTierFromPoints(pts),
          matched: state.seenCanonical.has(ans)
        }))
        .sort((a, b) => b.points - a.points || a.answer.localeCompare(b.answer));

      state.questionResults.push({
        id: prompt.id,
        question: prompt.question,
        category: prompt.category,
        count: state.hits.length,
        points: qPoints,
        rarestTier: rarest ? rarest.label : "None",
        rarestEmoji: rarest ? rarest.emoji : "⬜",
        hits: [...state.hits].reverse(),
        allAnswers: allAnswersWithRarity
      });

      if (state.qIndex + 1 < QUESTIONS_PER_DAY) {
        startQuestionReadPhase(state.qIndex + 1);
      } else {
        state.phase = "finished";
        const runs = getRunsMap();
        runs[state.dateKey] = {
          dateKey: state.dateKey,
          prompts: state.prompts,
          completed: true,
          results: state.questionResults,
          totalScore: state.totalScore,
          bestStreak: state.bestStreak
        };
        saveRunsMap(runs);
        render();
      }
    }

    function buildWhatsAppShareText() {
      const totalHits = state.questionResults.reduce((s, q) => s + q.count, 0);
      const order = { None: 0, Common: 1, Uncommon: 2, Rare: 3, Mythic: 4 };
      let topTier = "None";
      for (const q of state.questionResults) {
        if (order[q.rarestTier] > order[topTier]) topTier = q.rarestTier;
      }

      const lines = state.questionResults.map((q, idx) => {
        const blocks = q.hits.length
          ? q.hits.map(h => h.tier.emoji).join("")
          : "—";
        return `Q${idx + 1}: ${blocks} (${q.count} hits · ${q.points} pts)`;
      });

      return [
        `🔥 FURY — ${formatDisplayDate(state.dateKey)}`,
        `Score: ${state.totalScore} | Hits: ${totalHits} | Best Streak: ${state.bestStreak}x | Rarest: ${topTier}`,
        ``,
        ...lines
      ].join("\n");
    }

    function downloadStandaloneHtml() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function renderProgressBar() {
      return `
        <div class="progress-bar" aria-hidden="true">
          ${Array.from({ length: QUESTIONS_PER_DAY }, (_, i) => {
            let cls = "seg";
            if (state.phase === "finished" || i < state.qIndex) cls += " done";
            else if (i === state.qIndex) cls += " active";
            return `<div class="${cls}"></div>`;
          }).join("")}
        </div>
      `;
    }

    function renderBlitzDynamic(shouldShake) {
      const fb = document.getElementById("feedbackBox");
      const hitsEl = document.getElementById("hitsContainer");
      const countEl = document.getElementById("hitCountLabel");

      if (fb) {
        fb.className = `feedback ${state.feedback ? state.feedback.type : ""} ${shouldShake ? "shake" : ""}`;
        fb.textContent = state.feedback ? state.feedback.text : "";
      }
      if (countEl) {
        countEl.textContent = `${state.hits.length} valid`;
      }
      if (hitsEl) {
        hitsEl.innerHTML = state.hits
          .map(h => `
            <span class="hit-chip">
              <span>${h.label}</span>
              <span class="tier-badge ${h.tier.cls}">+${h.points}</span>
            </span>
          `)
          .join("");
      }
    }

    function render() {
      const root = document.getElementById("appRoot");

      if (state.phase === "loading") {
        root.innerHTML = `
          <div class="progress-bar">
            ${Array.from({ length: QUESTIONS_PER_DAY }, () => `<div class="seg"></div>`).join("")}
          </div>
          <div class="prompt-meta">
            <span>Fetching Today's Lineup</span>
            <span>No Repeats</span>
          </div>
          <h2 class="prompt-title">Loading today's 7 questions...</h2>
          <p style="color: var(--muted); margin: 0;">Pulling fresh questions from the web and checking your play history.</p>
        `;
        return;
      }

      if (state.phase === "idle") {
        root.innerHTML = `
          <div class="progress-bar">
            ${Array.from({ length: QUESTIONS_PER_DAY }, () => `<div class="seg"></div>`).join("")}
          </div>
          <div class="prompt-meta">
            <span>Daily 7-Question Challenge</span>
            <span>5s Read · 30s Blitz</span>
          </div>
          <h2 class="prompt-title">Ready for today's FURY run?</h2>
          <p style="color: var(--muted); margin-top: 0; line-height: 1.55;">
            You get <strong>7 non-repeating questions</strong> today (mixing live web trivia and daily prompts). Each question gives you <strong>5 seconds</strong> to read before a <strong>30-second</strong> blitz.
          </p>
          <div class="btn-row">
            <button id="startRunBtn" type="button">Start Today's 7-Question Run</button>
          </div>
        `;
        document.getElementById("startRunBtn").addEventListener("click", () => startQuestionReadPhase(0));
        return;
      }

      if (state.phase === "reading") {
        const prompt = state.prompts[state.qIndex];
        root.innerHTML = `
          ${renderProgressBar()}
          <div class="prompt-meta">
            <span>Question ${state.qIndex + 1} of ${QUESTIONS_PER_DAY}</span>
            <span>${prompt.category}</span>
          </div>
          <h2 class="prompt-title">${prompt.question}</h2>
          <div class="phase-banner">
            <span class="phase-label">READ THE PROMPT</span>
            <span class="timer" id="timerDisplay">${Math.max(1, Math.ceil(state.countdown))}s</span>
          </div>
          <div class="read-box">
            <strong>30-second typing blitz starts automatically when the read timer hits zero.</strong>
          </div>
        `;
        return;
      }

      if (state.phase === "blitz") {
        const prompt = state.prompts[state.qIndex];
        root.innerHTML = `
          ${renderProgressBar()}
          <div class="prompt-meta">
            <span>Question ${state.qIndex + 1} of ${QUESTIONS_PER_DAY}</span>
            <span id="hitCountLabel">${state.hits.length} valid</span>
          </div>
          <h2 class="prompt-title">${prompt.question}</h2>
          <div class="phase-banner">
            <span class="phase-label">BLITZ ACTIVE — TYPE & HIT ENTER</span>
            <span class="timer ${state.countdown <= 5 ? "urgent" : ""}" id="timerDisplay">${state.countdown.toFixed(1)}s</span>
          </div>
          <form class="input-row" id="answerForm">
            <input
              id="answerInput"
              type="text"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="Type an answer and press Enter..."
            />
            <button type="submit">Send</button>
          </form>
          <div class="feedback" id="feedbackBox"></div>
          <div class="hits-list" id="hitsContainer"></div>
        `;
        document.getElementById("answerForm").addEventListener("submit", handleAnswerSubmit);
        renderBlitzDynamic(false);
        const inp = document.getElementById("answerInput");
        if (inp) inp.focus();
        return;
      }

      const totalHits = state.questionResults.reduce((s, q) => s + q.count, 0);
      const shareText = buildWhatsAppShareText();

      root.innerHTML = `
        ${renderProgressBar()}
        <div class="prompt-meta">
          <span>Today's Run Complete</span>
          <span>${formatDisplayDate(state.dateKey)}</span>
        </div>
        <h2 class="prompt-title">FURY Summary</h2>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Total Score</div>
            <div class="stat-val">${state.totalScore}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Valid Answers</div>
            <div class="stat-val">${totalHits}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Best Streak</div>
            <div class="stat-val">${state.bestStreak}x</div>
          </div>
        </div>

        ${state.questionResults.map((q, idx) => {
          const bank = Array.isArray(q.allAnswers) ? q.allAnswers : [];
          return `
            <div class="q-summary-item">
              <div class="q-summary-head">
                <span>Q${idx + 1}: ${q.question}</span>
                <span>+${q.points} pts (${q.count})</span>
              </div>
              <div style="font-size: 0.85rem; color: var(--muted);">
                <strong>Your hits:</strong> ${q.hits.length ? q.hits.map(h => `${h.label} (${h.tier.label})`).join(" · ") : "No valid answers"}
              </div>
              ${bank.length ? `
                <div class="answer-bank-box">
                  <div class="bank-label">All answers & rarity (${bank.length} total):</div>
                  <div class="bank-chips">
                    ${bank.map(item => `
                      <span class="bank-chip ${item.matched ? "matched" : ""}">
                        <span>${item.matched ? "✓ " : ""}${item.answer}</span>
                        <span class="tier-badge ${item.tier.cls}">${item.tier.label} · ${item.points}</span>
                      </span>
                    `).join("")}
                  </div>
                </div>
              ` : ""}
            </div>
          `;
        }).join("")}

        <div style="margin-top: 18px;">
          <strong>Share to WhatsApp</strong>
          <textarea id="shareBox" readonly>${shareText}</textarea>
          <div class="btn-row">
            <button id="copyShareBtn" type="button">Copy for WhatsApp</button>
            <button class="secondary" id="downloadHtmlBtn" type="button">Save index.html</button>
          </div>
          <div class="feedback ok" id="copyStatus"></div>
        </div>
      `;

      document.getElementById("copyShareBtn").addEventListener("click", async () => {
        const box = document.getElementById("shareBox");
        const status = document.getElementById("copyStatus");
        try {
          await navigator.clipboard.writeText(box.value);
          status.textContent = "Copied to clipboard! Paste straight into WhatsApp.";
        } catch {
          box.select();
          document.execCommand("copy");
          status.textContent = "Selected/copied summary for WhatsApp.";
        }
      });

      document.getElementById("downloadHtmlBtn").addEventListener("click", downloadStandaloneHtml);
    }

    document.getElementById("devNextDayBtn").addEventListener("click", () => {
      setDayOffset(getDayOffset() + 1);
      initForCurrentDay();
    });

    document.getElementById("resetTodayBtn").addEventListener("click", () => {
      const dateKey = getEffectiveDateKey();
      const runs = getRunsMap();
      delete runs[dateKey];
      saveRunsMap(runs);
      initForCurrentDay();
    });

    initForCurrentDay();
  </script>
</body>
</html>
